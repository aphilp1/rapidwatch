name: Refresh HYCOM ocean state

# Pulls the live HYCOM ESPC ocean model (SST / D26 ocean-heat / surface currents)
# for the Gulf via OPeNDAP and commits the JSON grids the Live Sensor Systems map
# reads. HYCOM's analysis refreshes ~daily, so every 6 h keeps it current.

on:
  schedule:
    - cron: '20 */6 * * *'     # every 6 h at :20 (offset from the 30-min buoy job)
  workflow_dispatch:            # manual "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: ocean-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30         # HYCOM OPeNDAP subsetting can take several minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # netCDF4 manylinux wheels ship with OPeNDAP/DAP support, so no apt libs needed
      - name: Install deps
        run: pip install --quiet netCDF4 numpy

      - name: Pull HYCOM ocean state
        run: python build_ocean_state.py

      - name: Pull real Argo float positions
        run: python build_argo.py

      - name: Commit if changed
        run: |
          git config user.name  "rapidwatch-bot"
          git config user.email "aphilp1@users.noreply.github.com"
          git add data/ocean data/argo
          if git diff --cached --quiet; then
            echo "No ocean-state changes this run."
          else
            git commit -m "data: refresh HYCOM ocean state [skip ci]"
            git pull --rebase --autostash origin master || true   # avoid racing the buoy job's push
            git push
          fi
