<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RapidWatch — Live Sensor Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--abyss:#050b12;--water:#071420;--panel:#0d1c29;--line:rgba(120,160,180,.16);--line-2:rgba(120,160,180,.3);
  --ink:#e9eef3;--slate:#c3d0da;--mute:#8ba0b0;--aqua:#46cfd6;--amber:#ff8a3d;--violet:#c98bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--abyss);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:300;overflow:hidden}
#map{position:absolute;inset:0;background:#071420}
.leaflet-container{background:#071420;font-family:"IBM Plex Sans"}
.panel{position:absolute;z-index:1000;background:linear-gradient(180deg,rgba(13,28,41,.95),rgba(6,14,22,.92));
  border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
/* title / controls — top-left */
#ctl{top:14px;left:14px;width:290px;padding:15px 16px 14px}
#ctl h1{font-family:"Space Grotesk";font-weight:700;font-size:16px;letter-spacing:.03em;margin:0;display:flex;align-items:center;gap:9px}
#ctl h1 .dot{width:11px;height:11px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(255,138,61,.16),0 0 14px 2px rgba(255,138,61,.55);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,138,61,.05),0 0 20px 4px rgba(255,138,61,.7)}}
#ctl .sub{font-family:"IBM Plex Mono";font-size:10px;color:var(--mute);letter-spacing:.05em;margin:8px 0 0;line-height:1.5}
#ctl .lab{font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.15em;color:var(--mute);text-transform:uppercase;margin:14px 0 7px}
.vars{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vbtn{cursor:pointer;font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:7px 8px;border-radius:7px;
  background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:var(--slate);transition:all .15s;text-align:center}
.vbtn:hover{color:var(--ink);border-color:var(--aqua)}
.vbtn.on{background:rgba(70,207,214,.14);border-color:var(--aqua);color:var(--aqua)}
/* colorbar */
#cbar{margin-top:12px}
#cbar .bar{height:11px;border-radius:3px;border:1px solid var(--line-2)}
#cbar .ends{display:flex;justify-content:space-between;font-family:"IBM Plex Mono";font-size:9.5px;color:var(--slate);margin-top:4px}
#cbar .unit{font-family:"IBM Plex Mono";font-size:9px;color:var(--mute);text-align:center;margin-top:3px;letter-spacing:.04em}
/* missions legend — bottom-left */
#miss{bottom:16px;left:14px;width:290px;padding:13px 16px}
#miss h3{font-family:"Space Grotesk";font-weight:600;font-size:11px;letter-spacing:.05em;color:var(--slate);margin:0 0 9px;text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:9px;padding:4px 0;cursor:pointer;user-select:none}
.mrow .sw{width:14px;height:4px;border-radius:2px;flex:none}
.mrow .nm{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink);font-weight:600}
.mrow .op{font-size:10.5px;color:var(--mute);margin-left:auto}
.mrow.off{opacity:.4}
#miss .foot{font-family:"IBM Plex Mono";font-size:8.5px;color:var(--mute);line-height:1.5;border-top:1px solid var(--line);padding-top:8px;margin-top:9px}
#miss .foot a{color:var(--aqua);text-decoration:none}
/* popup */
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.leaflet-popup-tip{background:var(--panel);border:1px solid var(--line-2)}
.leaflet-popup-content{margin:12px 14px;font-size:12.5px;line-height:1.5;max-height:76vh;overflow-y:auto}
.gp .gk{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--amber)}
.gp h4{font-family:"Space Grotesk";font-weight:600;font-size:15px;margin:5px 0 2px}
.gp .op{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--aqua);margin-bottom:8px}
.gp .row{display:flex;justify-content:space-between;gap:14px;padding:2px 0;color:var(--slate);font-size:12px}
.gp .row b{color:var(--ink);font-weight:500}
.gp .pflab{font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin:9px 0 3px}
.glidernow{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 12px rgba(255,255,255,.5);animation:pulse2 1.7s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.25);opacity:.65}}
.gl-tip{background:rgba(13,28,41,.9)!important;border:1px solid var(--line-2)!important;color:var(--ink)!important;
  font-family:"IBM Plex Mono"!important;font-size:10px!important;font-weight:600;padding:1px 6px!important;border-radius:4px!important;box-shadow:0 2px 8px rgba(0,0,0,.5)!important;white-space:nowrap}
.gl-tip::before{display:none!important}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--aqua)!important;border-color:var(--line)!important}
.leaflet-bar{border-color:var(--line)!important;box-shadow:0 2px 16px rgba(0,0,0,.5)!important}
/* north arrow — same map furniture as the Gulf Map */
.rw-north{background:rgba(13,28,41,.85);border:1px solid var(--line);border-radius:8px;padding:4px 9px 5px;text-align:center;line-height:1;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 2px 12px rgba(0,0,0,.5)}
.rw-north .rw-arrow{font-size:13px;color:var(--amber);line-height:1}
.rw-north .rw-n{font-family:"IBM Plex Mono";font-size:11px;font-weight:600;color:var(--ink);margin-top:1px}
.leaflet-control-attribution{background:rgba(5,11,18,.7)!important;color:var(--mute)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--aqua)!important}
/* glider detail — docked top-right (fills empty space; never clips like a floating popup) */
#detail{top:14px;right:14px;width:236px;padding:14px 15px;display:none;max-height:calc(100% - 28px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
#detail.on{display:block}
.dclose{position:absolute;top:9px;right:12px;cursor:pointer;color:var(--mute);font-size:18px;line-height:1;z-index:2}
.dclose:hover{color:var(--aqua)}
@media(max-width:640px){#ctl,#miss,#detail{width:210px}}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="ctl">
  <h1><span class="dot"></span>LIVE SENSOR SYSTEMS</h1>
  <p class="sub">Active Slocum ocean gliders in the Gulf &mdash; live profiles from the IOOS National Glider DAC.</p>
  <div class="lab">Colour tracks by</div>
  <div class="vars" id="vars"></div>
  <div id="cbar">
    <div class="bar" id="cbarBar"></div>
    <div class="ends"><span id="cbarMin">&ndash;</span><span id="cbarMax">&ndash;</span></div>
    <div class="unit" id="cbarUnit"></div>
  </div>
</div>

<div class="panel" id="miss">
  <h3>Active Gulf missions</h3>
  <div id="mrows"></div>
  <div class="foot">Data: IOOS National Glider DAC (<a href="https://gliders.ioos.us" target="_blank" rel="noopener">gliders.ioos.us</a>). Tracks subsampled; click a glider for its latest depth profile. Near-surface values shown.</div>
</div>

<div class="panel" id="detail"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const VARS = {
  temperature: {label:'Temperature', unit:'°C',   fmt:v=>v.toFixed(1)+'°C'},
  salinity:    {label:'Salinity',    unit:'PSU',        fmt:v=>v.toFixed(2)},
  density:     {label:'Density',     unit:'kg m⁻³', fmt:v=>v.toFixed(1)},
  conductivity:{label:'Conductivity',unit:'S m⁻¹',  fmt:v=>v.toFixed(2)}
};
let curVar = 'temperature';

const map = L.map('map',{zoomControl:false,attributionControl:true,minZoom:4,maxZoom:11,worldCopyJump:false}).setView([24.6,-89.0],6);
map.setMaxBounds([[12,-103],[35,-74]]);
// zoom in/out — bottom-right, clear of the top-left + bottom-left panels
L.control.zoom({position:'bottomright'}).addTo(map);
// north arrow + scale bar — same map furniture as the Gulf Map
const NorthArrow = L.Control.extend({ options:{position:'bottomright'},
  onAdd:function(){ const d=L.DomUtil.create('div','rw-north');
    d.innerHTML='<div class="rw-arrow">▲</div><div class="rw-n">N</div>'; d.title='North (map is north-up)'; return d; } });
map.addControl(new NorthArrow());
L.control.scale({position:'bottomright',metric:true,imperial:true,maxWidth:140}).addTo(map);
// land base — EXACT copy of the Gulf Map's geography (clipped Natural Earth Gulf land, GULF_LAND)
map.createPane('landPane').style.zIndex = 250;   // land sits beneath tracks + markers
L.geoJSON(GULF_LAND,{pane:'landPane',interactive:false,
  style:{color:'rgba(70,207,214,.28)',weight:.8,fillColor:'#16242f',fillOpacity:1}}).addTo(map);

// ── turbo-lite ramp: deep blue -> cyan -> green -> yellow -> red ──
const STOPS = [[13,40,120],[20,120,200],[40,200,180],[150,220,90],[250,200,50],[240,90,45]];
function ramp(t){ t=Math.max(0,Math.min(1,t)); const x=t*(STOPS.length-1); const i=Math.floor(x), f=x-i;
  const a=STOPS[i], b=STOPS[Math.min(i+1,STOPS.length-1)];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
}
function pct(arr,p){ const a=arr.filter(x=>x!=null).sort((x,y)=>x-y); if(!a.length) return null; return a[Math.min(a.length-1,Math.max(0,Math.round((a.length-1)*p)))]; }

let DATA=null, tracks=[], nowMarkers=[], scale={min:0,max:1}, enabled={};

function scaleFor(v){
  const all=[]; DATA.features.forEach(f=>{ if(f.properties.kind==='track' && enabled[f.properties.id]) all.push(...f.properties.vals[v].filter(x=>x!=null)); });
  return {min:pct(all,0.02), max:pct(all,0.98)};
}
function colorAt(val){ if(val==null) return '#5f7585'; const t=(val-scale.min)/((scale.max-scale.min)||1); return ramp(t); }

function drawTracks(){
  tracks.forEach(t=>map.removeLayer(t)); tracks=[];
  scale=scaleFor(curVar);
  DATA.features.filter(f=>f.properties.kind==='track' && enabled[f.properties.id]).forEach(f=>{
    const c=f.geometry.coordinates, vals=f.properties.vals[curVar];
    for(let i=0;i<c.length-1;i++){
      const seg=L.polyline([[c[i][1],c[i][0]],[c[i+1][1],c[i+1][0]]],
        {color:colorAt(vals[i]),weight:3,opacity:.9,lineCap:'round'});
      seg.addTo(map); tracks.push(seg);
    }
  });
  // colorbar
  const grad=[]; for(let i=0;i<=10;i++) grad.push(ramp(i/10));
  document.getElementById('cbarBar').style.background=`linear-gradient(90deg,${grad.join(',')})`;
  document.getElementById('cbarMin').textContent=scale.min!=null?VARS[curVar].fmt(scale.min):'–';
  document.getElementById('cbarMax').textContent=scale.max!=null?VARS[curVar].fmt(scale.max):'–';
  document.getElementById('cbarUnit').textContent=VARS[curVar].unit;
}

// ── depth-profile mini chart (SVG) for the selected variable ──
function profileSVG(p){
  const d=p.profile.depth, y=p.profile[curVar];
  const pts=d.map((dv,i)=>[y[i],dv]).filter(a=>a[0]!=null);
  if(pts.length<2) return '<div style="font-size:10px;color:var(--mute)">no profile</div>';
  const W=196,H=116,mL=32,mR=8,mT=6,mB=18;
  const xs=pts.map(a=>a[0]), ds=pts.map(a=>a[1]);
  const xmin=Math.min(...xs),xmax=Math.max(...xs),dmax=Math.max(...ds);
  const X=v=>mL+(xmax===xmin?0.5:(v-xmin)/(xmax-xmin))*(W-mL-mR);
  const Y=v=>mT+(v/(dmax||1))*(H-mT-mB);
  let path=pts.map((a,i)=>(i?'L':'M')+X(a[0]).toFixed(1)+' '+Y(a[1]).toFixed(1)).join(' ');
  let dots=pts.map(a=>`<circle cx="${X(a[0]).toFixed(1)}" cy="${Y(a[1]).toFixed(1)}" r="1.6" fill="${colorAt(a[0])}"/>`).join('');
  const gy=[0,Math.round(dmax/2),Math.round(dmax)];
  const grid=gy.map(g=>`<line x1="${mL}" y1="${Y(g)}" x2="${W-mR}" y2="${Y(g)}" stroke="rgba(120,160,180,.14)"/><text x="2" y="${Y(g)+3}" font-size="8" fill="#8ba0b0" font-family="IBM Plex Mono">${g}</text>`).join('');
  return `<svg width="${W}" height="${H}" style="display:block">${grid}
    <path d="${path}" fill="none" stroke="${p.color}" stroke-width="1.6"/>${dots}
    <text x="${W-mR}" y="${H-6}" font-size="8" fill="#8ba0b0" font-family="IBM Plex Mono" text-anchor="end">${VARS[curVar].label} (${VARS[curVar].unit}) →</text>
    <text x="2" y="${H-6}" font-size="8" fill="#8ba0b0" font-family="IBM Plex Mono">depth m ↓</text></svg>`;
}

function popupHTML(p){
  const s=p.surface, t=new Date(p.time);
  const ago=Math.round((Date.now()-t.getTime())/3.6e6);
  let rows='';
  for(const v in VARS) rows+=`<div class="row"><span>${VARS[v].label}</span><b>${s[v]!=null?VARS[v].fmt(s[v]):'–'}</b></div>`;
  return `<div class="gp"><div class="gk">Live Slocum glider</div>
    <h4>${p.id}</h4><div class="op">${p.operator}</div>
    <div class="row"><span>Latest fix</span><b>${isNaN(ago)?'–':ago+' h ago'}</b></div>
    <div class="row"><span>Max dive depth</span><b>${p.maxDepth!=null?p.maxDepth+' m':'–'}</b></div>
    <div class="row"><span>Measurements</span><b>${p.n.toLocaleString()}</b></div>
    <div class="pflab">Near-surface now</div>${rows}
    <div class="pflab">Most-recent depth profile</div>${profileSVG(p)}</div>`;
}

function drawNow(){
  nowMarkers.forEach(m=>map.removeLayer(m)); nowMarkers=[];
  DATA.features.filter(f=>f.properties.kind==='now' && enabled[f.properties.id]).forEach(f=>{
    const p=f.properties, ll=[f.geometry.coordinates[1],f.geometry.coordinates[0]];
    const m=L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="glidernow" style="background:${p.color}"></div>`,iconSize:[16,16],iconAnchor:[8,8]})})
      .bindTooltip(p.id,{permanent:true,direction:'right',offset:[8,0],className:'gl-tip'})
      .on('click',()=>setDetail(p));
    m.addTo(map); nowMarkers.push(m);
  });
  if(curDetail && !enabled[curDetail.id]) closeDetail();   // close panel if its glider was toggled off
}

function redraw(){ drawTracks(); drawNow(); }

function buildUI(){
  // variable buttons
  const vb=document.getElementById('vars');
  Object.keys(VARS).forEach(v=>{
    const b=document.createElement('div'); b.className='vbtn'+(v===curVar?' on':''); b.textContent=VARS[v].label;
    b.onclick=()=>{ curVar=v; [...vb.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); redraw(); refreshOpenPopup(); };
    vb.appendChild(b);
  });
  // mission rows (toggle a glider on/off)
  const mr=document.getElementById('mrows');
  DATA.features.filter(f=>f.properties.kind==='now').forEach(f=>{
    const p=f.properties;
    const row=document.createElement('div'); row.className='mrow';
    row.innerHTML=`<span class="sw" style="background:${p.color}"></span><span class="nm">${p.id}</span><span class="op">${p.operator.replace('University','U.').replace('Univ. of ','')}</span>`;
    row.onclick=()=>{ enabled[p.id]=!enabled[p.id]; row.classList.toggle('off',!enabled[p.id]); redraw(); };
    mr.appendChild(row);
  });
}
let curDetail=null;
function setDetail(p){ curDetail=p; const d=document.getElementById('detail');
  d.innerHTML='<span class="dclose" title="Close">&times;</span>'+popupHTML(p);
  d.classList.add('on'); d.querySelector('.dclose').onclick=closeDetail; d.scrollTop=0;
}
function closeDetail(){ curDetail=null; document.getElementById('detail').classList.remove('on'); }
function refreshOpenPopup(){ if(curDetail) setDetail(curDetail); }   // re-render the docked detail for the newly-selected variable

fetch('data/gliders/gliders_gulf.geojson').then(r=>r.json()).then(d=>{
  DATA=d;
  d.features.filter(f=>f.properties.kind==='now').forEach(f=>enabled[f.properties.id]=true);
  buildUI(); redraw();
  // fit to the tracks
  // fixed Gulf framing (matches the Gulf Map) — do not auto-fit to the gliders
}).catch(e=>{
  document.getElementById('ctl').insertAdjacentHTML('beforeend','<p class="sub" style="color:#ff8a3d">Glider data unavailable. Run build_gliders.py.</p>');
});
</script>
